services:
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: sgi-auth-service
    env_file:
      - .env
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: ${SUPABASE_DB_URL}
      DB_USERNAME: ${SUPABASE_DB_USERNAME}
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
    volumes:
      - type: bind
        source: ${JWT_PRIVATE_KEY_PATH_HOST:-./.secret/keys/jwt-private.pem}
        target: /run/secrets/jwt-private.pem
        read_only: true
      - type: bind
        source: ${JWT_PUBLIC_KEY_PATH_HOST:-./.secret/keys/jwt-public.pem}
        target: /run/secrets/jwt-public.pem
        read_only: true
    restart: unless-stopped

  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile
    container_name: sgi-core-service
    env_file:
      - .env
    ports:
      - ${CORE_SERVICE_PORT:-8083}:8083
    environment:
      SERVER_PORT: 8083
      DB_URL: ${SUPABASE_DB_URL}
      DB_USERNAME: ${SUPABASE_DB_USERNAME}
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEY_PATH_HOST:-./.secret/keys/jwt-public.pem}
        target: /run/secrets/jwt-public.pem
        read_only: true
    restart: unless-stopped
  portal-cliente:
    build:
      context: ./apps/portal-cliente
      dockerfile: Dockerfile
    container_name: sgi-portal-cliente
    ports:
      - "5173:5173"
    environment:
      VITE_AUTH_API_URL: /api/auth
      AUTH_PROXY_TARGET: http://auth-service:8081
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    volumes:
      - ./apps/portal-cliente/src:/app/src
    depends_on:
      - auth-service
    restart: unless-stopped

  backoffice:
    build:
      context: ./apps/backoffice
      dockerfile: Dockerfile
    container_name: sgi-backoffice
    ports:
      - "5174:5174"
    environment:
      VITE_AUTH_API_URL: /api/auth
      VITE_CMS_API_URL: /cms-api
      VITE_CORE_API_URL: /api/core

      AUTH_PROXY_TARGET: http://auth-service:8081
      CMS_PROXY_TARGET: http://pagina-web-backend:8082
      CORE_PROXY_TARGET: http://core-service:8083

      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    volumes:
      - ./apps/backoffice/src:/app/src
    depends_on:
      - auth-service
    restart: unless-stopped

  pagina-web-backend:
    build:
      context: ./services/cms-service
      dockerfile: Dockerfile
    container_name: sgi-pagina-web-backend
    env_file:
      - .env
    ports:
      - "${WEB_BACKEND_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: ${SUPABASE_DB_URL}
      DB_USERNAME: ${SUPABASE_DB_USERNAME}
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      CMS_STORAGE_BUCKET: ${CMS_STORAGE_BUCKET:-cms-public}
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEY_PATH_HOST:-./.secret/keys/jwt-public.pem}
        target: /run/secrets/jwt-public.pem
        read_only: true
    restart: unless-stopped

  pagina-web-frontend:
    build:
      context: ./apps/pagina-web
      dockerfile: Dockerfile
    container_name: sgi-pagina-web-frontend
    env_file:
      - .env
    ports:
      - "${WEB_FRONTEND_PORT:-5175}:5175"
    environment:
      VITE_API_URL: /cms-api
      API_PROXY_TARGET: http://pagina-web-backend:8082
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    volumes:
      - ./apps/pagina-web/src:/app/src
    depends_on:
      - pagina-web-backend
    restart: unless-stopped
