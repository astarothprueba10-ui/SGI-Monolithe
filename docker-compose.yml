services:
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: sgi-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: ${SUPABASE_DB_URL}
      DB_USERNAME: ${SUPABASE_DB_USERNAME}
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/run/secrets/jwt-private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/run/secrets/jwt-public.pem}
      MAIL_FROM: ${MAIL_FROM:-no-reply@monolithe.local}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-dummy}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-dummy}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
    volumes:
      - type: bind
        source: ${JWT_PRIVATE_KEY_PATH_HOST:-./.secret/keys/jwt-private.pem}
        target: /run/secrets/jwt-private.pem
        read_only: true
      - type: bind
        source: ${JWT_PUBLIC_KEY_PATH_HOST:-./.secret/keys/jwt-public.pem}
        target: /run/secrets/jwt-public.pem
        read_only: true
    restart: unless-stopped

  portal-cliente:
    build:
      context: ./apps/portal-cliente
      dockerfile: Dockerfile
    container_name: sgi-portal-cliente
    ports:
      - "5173:5173"
    environment:
      VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:-http://localhost:8081/api/auth}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    volumes:
      - ./apps/portal-cliente/src:/app/src
    depends_on:
      - auth-service
    restart: unless-stopped

  backoffice:
    build:
      context: ./apps/backoffice
      dockerfile: Dockerfile
    container_name: sgi-backoffice
    ports:
      - "5174:5174"
    environment:
      VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:-http://localhost:8081/api/auth}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    volumes:
      - ./apps/backoffice/src:/app/src
    depends_on:
      - auth-service
    restart: unless-stopped

  pagina-web-backend:
    build:
      context: ./services/cms-service
      dockerfile: Dockerfile
    container_name: sgi-pagina-web-backend
    env_file:
      - .env
    ports:
      - "${WEB_BACKEND_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: ${SUPABASE_DB_URL}
      DB_USERNAME: ${SUPABASE_DB_USERNAME}
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/run/secrets/jwt-public.pem}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEY_PATH_HOST:-./.secret/keys/jwt-public.pem}
        target: /run/secrets/jwt-public.pem
        read_only: true
    restart: unless-stopped

  pagina-web-frontend:
    build:
      context: ./apps/pagina-web
      dockerfile: Dockerfile
    container_name: sgi-pagina-web-frontend
    env_file:
      - .env
    ports:
      - "${WEB_FRONTEND_PORT:-5175}:5175"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8082}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    volumes:
      - ./apps/pagina-web/src:/app/src
    depends_on:
      - pagina-web-backend
    restart: unless-stopped
