# Entorno de ensayo aislado: no usar junto al compose habitual.
# Requiere credenciales nuevas y claves en .secret/prod-ensayo/keys/.
name: "sgi-prod-ensayo"
services:
  auth-service:
    build:
      context: "./services/auth-service"
      dockerfile: "Dockerfile"
    ports:
      - "127.0.0.1:18081:8081"
    env_file:
      - .secret/prod-ensayo/keys/financing-mfa.env
    environment:
      SERVER_PORT: 8081
      DB_URL: "jdbc:postgresql://aws-0-us-west-1.pooler.supabase.com:5432/postgres?sslmode=require&escapeSyntaxCallMode=callIfNoReturn"
      DB_USERNAME: "${PROD_ENSAYO_AUTH_DB_USERNAME:?Configurar PROD_ENSAYO_AUTH_DB_USERNAME}"
      DB_PASSWORD: "${PROD_ENSAYO_AUTH_DB_PASSWORD:?Configurar PROD_ENSAYO_AUTH_DB_PASSWORD}"
      CORS_ALLOWED_ORIGINS: "http://localhost:15173,http://localhost:15174,http://localhost:15175,http://127.0.0.1:15173,http://127.0.0.1:15174,http://127.0.0.1:15175"
      JWT_PUBLIC_KEY_PATH: "/run/secrets/jwt-public.pem"
      JWT_PRIVATE_KEY_PATH: "/run/secrets/jwt-private.pem"
      AUTH_MFA_KEY_PATH: "/run/secrets/auth-mfa.key"
      MAIL_HOST: "127.0.0.1"
      MAIL_PORT: 1025
      MAIL_FROM: "ensayo@example.invalid"
      MAIL_USERNAME: "disabled"
      MAIL_PASSWORD: "disabled"
      MAIL_AUTH: "false"
      MAIL_STARTTLS_ENABLE: "false"
      MAIL_STARTTLS_REQUIRED: "false"
    volumes:
      -
        type: "bind"
        source: "./.secret/prod-ensayo/keys/jwt-private.pem"
        target: "/run/secrets/jwt-private.pem"
        read_only: true
        bind:
          create_host_path: false
      -
        type: "bind"
        source: "./.secret/prod-ensayo/keys/jwt-public.pem"
        target: "/run/secrets/jwt-public.pem"
        read_only: true
        bind:
          create_host_path: false
      -
        type: "bind"
        source: "./.secret/prod-ensayo/keys/auth-mfa.key"
        target: "/run/secrets/auth-mfa.key"
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
  core-service:
    build:
      context: "./services/core-service"
      dockerfile: "Dockerfile"
    ports:
      - "127.0.0.1:18083:8083"
    environment:
      SERVER_PORT: 8083
      DB_URL: "jdbc:postgresql://aws-0-us-west-1.pooler.supabase.com:5432/postgres?sslmode=require&escapeSyntaxCallMode=callIfNoReturn"
      DB_USERNAME: "${PROD_ENSAYO_CORE_DB_USERNAME:?Configurar PROD_ENSAYO_CORE_DB_USERNAME}"
      DB_PASSWORD: "${PROD_ENSAYO_CORE_DB_PASSWORD:?Configurar PROD_ENSAYO_CORE_DB_PASSWORD}"
      CORS_ALLOWED_ORIGINS: "http://localhost:15173,http://localhost:15174,http://localhost:15175,http://127.0.0.1:15173,http://127.0.0.1:15174,http://127.0.0.1:15175"
      JWT_PUBLIC_KEY_PATH: "/run/secrets/jwt-public.pem"
      SERVICES_AUTH_URL: "http://auth-service:8081"
      SUPABASE_URL: "https://ljxbkfvtbbucakkvdzmr.supabase.co"
      SUPABASE_STORAGE_URL: "https://ljxbkfvtbbucakkvdzmr.supabase.co/storage/v1"
      SUPABASE_SERVICE_ROLE_KEY: "${PROD_ENSAYO_STORAGE_KEY:?Configurar PROD_ENSAYO_STORAGE_KEY}"
    volumes:
      -
        type: "bind"
        source: "./.secret/prod-ensayo/keys/jwt-public.pem"
        target: "/run/secrets/jwt-public.pem"
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
  pagina-web-backend:
    build:
      context: "./services/cms-service"
      dockerfile: "Dockerfile"
    ports:
      - "127.0.0.1:18082:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: "jdbc:postgresql://aws-0-us-west-1.pooler.supabase.com:5432/postgres?sslmode=require&escapeSyntaxCallMode=callIfNoReturn"
      DB_USERNAME: "${PROD_ENSAYO_CMS_DB_USERNAME:?Configurar PROD_ENSAYO_CMS_DB_USERNAME}"
      DB_PASSWORD: "${PROD_ENSAYO_CMS_DB_PASSWORD:?Configurar PROD_ENSAYO_CMS_DB_PASSWORD}"
      CORS_ALLOWED_ORIGINS: "http://localhost:15173,http://localhost:15174,http://localhost:15175,http://127.0.0.1:15173,http://127.0.0.1:15174,http://127.0.0.1:15175"
      JWT_PUBLIC_KEY_PATH: "/run/secrets/jwt-public.pem"
      SUPABASE_URL: "https://ljxbkfvtbbucakkvdzmr.supabase.co"
      SUPABASE_SECRET_KEY: "${PROD_ENSAYO_STORAGE_KEY:?Configurar PROD_ENSAYO_STORAGE_KEY}"
      CMS_STORAGE_BUCKET: "cms-public"
      CMS_PUBLICACION_IMAGENES_HABILITADA: "false"
      CMS_PUBLICACION_VISIBILIDAD_ENABLED: "false"
    volumes:
      -
        type: "bind"
        source: "./.secret/prod-ensayo/keys/jwt-public.pem"
        target: "/run/secrets/jwt-public.pem"
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
  portal-cliente:
    build:
      context: "./apps/portal-cliente"
      dockerfile: "Dockerfile"
    ports:
      - "127.0.0.1:15173:5173"
    environment:
      VITE_AUTH_API_URL: "/api/auth"
      AUTH_PROXY_TARGET: "http://auth-service:8081"
      VITE_CORE_API_URL: "/api/core"
      CORE_PROXY_TARGET: "http://core-service:8083"
      VITE_SUPABASE_URL: "https://ljxbkfvtbbucakkvdzmr.supabase.co"
      VITE_SUPABASE_ANON_KEY: "${PROD_ENSAYO_PUBLIC_KEY:?Configurar PROD_ENSAYO_PUBLIC_KEY}"
    depends_on:
      - "auth-service"
      - "core-service"
    restart: "no"
  backoffice:
    build:
      context: "./apps/backoffice"
      dockerfile: "Dockerfile"
    ports:
      - "127.0.0.1:15174:5174"
    environment:
      VITE_AUTH_API_URL: "/api/auth"
      VITE_CMS_API_URL: "/cms-api"
      VITE_CORE_API_URL: "/api/core"
      AUTH_PROXY_TARGET: "http://auth-service:8081"
      CMS_PROXY_TARGET: "http://pagina-web-backend:8082"
      CORE_PROXY_TARGET: "http://core-service:8083"
      VITE_CMS_PUBLICACION_TEXTOS_HABILITADA: "false"
      VITE_CMS_PUBLICACION_IMAGENES_HABILITADA: "false"
      VITE_CMS_PUBLICACION_VISIBILIDAD_HABILITADA: "false"
      VITE_SUPABASE_URL: "https://ljxbkfvtbbucakkvdzmr.supabase.co"
      VITE_SUPABASE_ANON_KEY: "${PROD_ENSAYO_PUBLIC_KEY:?Configurar PROD_ENSAYO_PUBLIC_KEY}"
    depends_on:
      - "auth-service"
      - "core-service"
      - "pagina-web-backend"
    restart: "no"
  pagina-web-frontend:
    build:
      context: "./apps/pagina-web"
      dockerfile: "Dockerfile"
    ports:
      - "127.0.0.1:15175:5175"
    environment:
      VITE_API_URL: "/cms-api"
      API_PROXY_TARGET: "http://pagina-web-backend:8082"
      VITE_CMS_HERO_PUBLICADO_ENABLED: "false"
      VITE_CMS_HERO_PROMO_SLIDES_ENABLED: "false"
      VITE_SUPABASE_URL: "https://ljxbkfvtbbucakkvdzmr.supabase.co"
      VITE_SUPABASE_ANON_KEY: "${PROD_ENSAYO_PUBLIC_KEY:?Configurar PROD_ENSAYO_PUBLIC_KEY}"
    depends_on:
      - "pagina-web-backend"
    restart: "no"
