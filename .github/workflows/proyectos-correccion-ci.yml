name: Proyectos - validacion aislada

on:
  push:
    branches: [correccion_proyectos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backoffice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run test:projects
      - run: npm run build
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f services/core-service/pom.xml test
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_local_test
          POSTGRES_DB: gestion_proyectos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci_local_test
      PGDATABASE: gestion_proyectos_test
    steps:
      - uses: actions/checkout@v4
      - run: |
          psql -v ON_ERROR_STOP=1 -f database/tests/fixtures/gestion_comercial_170_fixture.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/170_inm_gestion_comercial_independiente.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/gestion_comercial_170_pg_test.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/171_inm_gestion_etapas.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/gestion_comercial_171_pg_test.sql
