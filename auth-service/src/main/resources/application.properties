spring.application.name=auth-service

server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info

security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}

security.jwt.issuer=monolithe-auth-service
security.jwt.access-token-expiration=900
security.jwt.refresh-token-expiration=604800
security.auth.max-failed-attempts=5
security.auth.lock-duration=900
security.auth.password-reset-expiration=900

security.mail.from=${MAIL_FROM}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}