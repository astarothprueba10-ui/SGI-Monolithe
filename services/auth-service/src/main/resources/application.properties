spring.application.name=auth-service

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info

security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}

security.jwt.issuer=monolithe-auth-service
security.jwt.access-token-expiration=900
security.jwt.refresh-token-expiration=604800
security.auth.max-failed-attempts=5
security.auth.lock-duration=900
security.auth.password-reset-expiration=900
security.auth.password-reset-otp-expiration=600
security.auth.backoffice-password-reset-url=${BACKOFFICE_PASSWORD_RESET_URL:http://localhost:5174/restablecer-contrasena}
security.auth.portal-password-reset-url=${PORTAL_PASSWORD_RESET_URL:http://localhost:5173/restablecer-contrasena}
security.portal.administrativo-url=${SECURITY_PORTAL_ADMINISTRATIVO_URL:https://portal-administrativo-delta.vercel.app/}
security.portal.cliente-url=${SECURITY_PORTAL_CLIENTE_URL:https://portal-cliente-kohl.vercel.app/}

security.mail.from=${MAIL_FROM}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:15000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT:30000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:30000}

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.error.include-stacktrace=never
server.error.include-message=never
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# Autenticación de comunicaciones internas entre microservicios
security.internal.mail-key=${INTERNAL_MAIL_KEY:}


# Clave compartida para comunicaciones internas con Auth Service
security.internal.mail-key=${INTERNAL_MAIL_KEY:}
