spring.application.name=core-service

server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info

security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}
security.jwt.issuer=monolithe-auth-service

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

server.error.include-stacktrace=never
server.error.include-message=never

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

security.mail.worker-email-confirmation-url=${WORKER_EMAIL_CONFIRMATION_URL:http://localhost:5174/confirmar-correo}
security.mail.worker-email-confirmation-expiration-minutes=${WORKER_EMAIL_CONFIRMATION_EXPIRATION_MINUTES:30}
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
security.internal.mail-key=${INTERNAL_MAIL_KEY:}

supabase.storage.url=${SUPABASE_STORAGE_URL:${SUPABASE_URL:}/storage/v1}
supabase.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_SECRET_KEY:}}

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB
