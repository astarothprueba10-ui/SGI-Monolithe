# Staging aislado de Railway. Sólo Auth Service interno; no se enruta a Core production.
server {
    listen 5174;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; return 200 'staging-ready'; }

    location ^~ /api/auth/ {
        proxy_pass http://auth-service.railway.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
        proxy_buffering off;
    }

    location ^~ /api/security/ {
        proxy_pass http://auth-service.railway.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Core/CMS no están desplegados en este proyecto de dos servicios.
    # Fallo cerrado; jamás conectar estas rutas a instancias de producción.
    location ^~ /api/core/ { return 503; }
    location ^~ /cms-api/ { return 503; }

    location ~* /\.(?!well-known) { deny all; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
